# Statické soubory leží v kořeni, funkce v netlify/functions.
[build]
  command = "npm install"
  publish = "."

# Samostatná sekce, ne zastaralý klíč build.functions — přes ni projdou
# funkce moderním balíčkovačem, který jim předá i přístup k Blobs.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
