<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noční nákupy — kdo byl kde</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header>
    <h1>Noční nákupy</h1>
    <p class="subtitle">Kdo byl v obchodě mezi 21:00 a zavíračkou</p>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="card who-am-i">
    <div class="field">
      <label for="person-select">Jsi</label>
      <select id="person-select"></select>
    </div>
    <div class="field">
      <label for="place-select">Kde</label>
      <select id="place-select"></select>
    </div>
  </section>

  <section class="card">
    <h2>Dnešní check-in <span id="today-date"></span></h2>
    <div id="shop-grid" class="shop-grid"></div>
  </section>

  <section class="card">
    <h2>Obchody poblíž</h2>
    <div class="nearby-controls">
      <button id="find-btn" class="primary-btn" type="button">Najít obchody poblíž</button>
      <select id="radius-select" aria-label="Okruh hledání">
        <option value="600">600 m</option>
        <option value="1200" selected>1,2 km</option>
        <option value="3000">3 km</option>
      </select>
    </div>
    <p id="nearby-status" class="legend"></p>
    <div id="nearby-list" class="nearby-list"></div>
  </section>

  <section class="card map-card">
    <h2>Hvězdná mapa</h2>
    <div class="stats" id="stats"></div>
    <div class="map-holder">
      <svg id="cz-map" viewBox="0 0 1000 566" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="Mapa České republiky s návštěvami obchodů">
        <defs>
          <radialGradient id="glow">
            <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
          </radialGradient>

      </svg>
      <p class="legend">
        Jasnější hvězda = víc návštěv na jednom místě.
        <span id="nogeo"></span>
      </p>
    </div>
  </section>

  <section class="card">
    <h2>Žebříček</h2>
    <ol id="leaderboard" class="leaderboard"></ol>
  </section>

  <section class="card">
    <h2>Historie</h2>
    <div id="history" class="history"></div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
